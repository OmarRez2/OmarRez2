<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Omar Rezk - Data Analyst and BI Developer</title>
  <desc id="desc">Professional dark blue banner with a subtly animated analytics chart.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.58" stop-color="#0b1c35"/>
      <stop offset="1" stop-color="#102a45"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.55" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#7dd3fc" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="24" fill="url(#background)"/>
  <rect width="1200" height="300" rx="24" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="298" rx="23" fill="none" stroke="#1e4b6f" stroke-width="2"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="68" y="86" fill="#94a3b8" font-size="16" font-weight="600" letter-spacing="4">DATA • INSIGHT • IMPACT</text>
    <text x="64" y="148" fill="#f8fafc" font-size="52" font-weight="700" letter-spacing="1">OMAR REZK</text>
    <text x="67" y="186" fill="#7dd3fc" font-size="20" font-weight="600">Data Analyst  |  BI Analyst  |  Power BI Developer</text>
    <text x="67" y="222" fill="#cbd5e1" font-size="17">Turning complex data into clear, decision-ready insights.</text>

    <g transform="translate(67 246)" font-size="12" font-weight="700" letter-spacing="1">
      <rect width="88" height="28" rx="7" fill="#f2c811"/>
      <text x="44" y="19" fill="#111827" text-anchor="middle">POWER BI</text>
      <rect x="100" width="95" height="28" rx="7" fill="#15395b" stroke="#38bdf8" stroke-opacity="0.65"/>
      <text x="147.5" y="19" fill="#e0f2fe" text-anchor="middle">SQL SERVER</text>
      <rect x="207" width="78" height="28" rx="7" fill="#15395b" stroke="#38bdf8" stroke-opacity="0.65"/>
      <text x="246" y="19" fill="#e0f2fe" text-anchor="middle">PYTHON</text>
      <rect x="297" width="70" height="28" rx="7" fill="#15395b" stroke="#34d399" stroke-opacity="0.65"/>
      <text x="332" y="19" fill="#d1fae5" text-anchor="middle">EXCEL</text>
    </g>
  </g>

  <g transform="translate(690 38)">
    <rect width="445" height="222" rx="18" fill="#06101f" fill-opacity="0.55" stroke="#244b6d"/>
    <text x="26" y="34" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600">PERFORMANCE OVERVIEW</text>

    <g transform="translate(25 55)">
      <line x1="0" y1="130" x2="395" y2="130" stroke="#94a3b8" stroke-opacity="0.2"/>
      <line x1="0" y1="90" x2="395" y2="90" stroke="#94a3b8" stroke-opacity="0.12"/>
      <line x1="0" y1="50" x2="395" y2="50" stroke="#94a3b8" stroke-opacity="0.12"/>

      <g fill="#1e3a5f">
        <rect x="10" y="100" width="20" height="30" rx="3"><animate attributeName="y" values="100;92;100" dur="3.4s" repeatCount="indefinite"/><animate attributeName="height" values="30;38;30" dur="3.4s" repeatCount="indefinite"/></rect>
        <rect x="52" y="82" width="20" height="48" rx="3"><animate attributeName="y" values="82;75;82" dur="3.8s" repeatCount="indefinite"/><animate attributeName="height" values="48;55;48" dur="3.8s" repeatCount="indefinite"/></rect>
        <rect x="94" y="91" width="20" height="39" rx="3"><animate attributeName="y" values="91;84;91" dur="3.2s" repeatCount="indefinite"/><animate attributeName="height" values="39;46;39" dur="3.2s" repeatCount="indefinite"/></rect>
        <rect x="136" y="62" width="20" height="68" rx="3"><animate attributeName="y" values="62;54;62" dur="3.6s" repeatCount="indefinite"/><animate attributeName="height" values="68;76;68" dur="3.6s" repeatCount="indefinite"/></rect>
        <rect x="178" y="72" width="20" height="58" rx="3"><animate attributeName="y" values="72;66;72" dur="3.1s" repeatCount="indefinite"/><animate attributeName="height" values="58;64;58" dur="3.1s" repeatCount="indefinite"/></rect>
        <rect x="220" y="48" width="20" height="82" rx="3"><animate attributeName="y" values="48;39;48" dur="3.9s" repeatCount="indefinite"/><animate attributeName="height" values="82;91;82" dur="3.9s" repeatCount="indefinite"/></rect>
        <rect x="262" y="57" width="20" height="73" rx="3"><animate attributeName="y" values="57;51;57" dur="3.3s" repeatCount="indefinite"/><animate attributeName="height" values="73;79;73" dur="3.3s" repeatCount="indefinite"/></rect>
        <rect x="304" y="30" width="20" height="100" rx="3"><animate attributeName="y" values="30;22;30" dur="3.7s" repeatCount="indefinite"/><animate attributeName="height" values="100;108;100" dur="3.7s" repeatCount="indefinite"/></rect>
        <rect x="346" y="40" width="20" height="90" rx="3"><animate attributeName="y" values="40;34;40" dur="3.5s" repeatCount="indefinite"/><animate attributeName="height" values="90;96;90" dur="3.5s" repeatCount="indefinite"/></rect>
      </g>

      <path id="trend" d="M20 105 C55 96 70 75 104 82 S152 53 188 64 S231 38 272 50 S320 20 366 29" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7">
        <animate attributeName="stroke-dashoffset" from="45" to="0" dur="2.8s" repeatCount="indefinite"/>
      </path>
      <circle r="5" fill="#e0f2fe" filter="url(#softGlow)">
        <animateMotion dur="5s" repeatCount="indefinite"><mpath href="#trend"/></animateMotion>
      </circle>

      <g font-family="Arial, Helvetica, sans-serif">
        <text x="0" y="160" fill="#64748b" font-size="11">DATA QUALITY</text>
        <text x="132" y="160" fill="#64748b" font-size="11">KPI DESIGN</text>
        <text x="255" y="160" fill="#64748b" font-size="11">BUSINESS VALUE</text>
      </g>
    </g>
  </g>
</svg>
