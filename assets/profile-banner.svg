<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Omar Rezk - Data and Business Intelligence Portfolio</title>
  <desc id="desc">Animated dark portfolio banner with glowing analytics charts, KPI cards, and data nodes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#030712"/><stop offset="0.52" stop-color="#07162c"/><stop offset="1" stop-color="#151047"/></linearGradient>
    <linearGradient id="cyanPurple" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="0.48" stop-color="#3b82f6"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
    <linearGradient id="chartFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.32"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient>
    <radialGradient id="orb"><stop offset="0" stop-color="#7c3aed" stop-opacity="0.5"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#38bdf8" stroke-opacity="0.055"/></pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000814" flood-opacity="0.55"/></filter>
    <clipPath id="frame"><rect width="1200" height="360" rx="26"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#bg)"/><rect width="1200" height="360" fill="url(#grid)"/>
    <circle cx="1110" cy="-35" r="245" fill="url(#orb)"><animate attributeName="r" values="225;260;225" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="630" cy="405" r="180" fill="#06b6d4" opacity="0.08"><animate attributeName="cx" values="610;690;610" dur="10s" repeatCount="indefinite"/></circle>
    <path d="M720 -20C805 60 842 77 938 30S1110 40 1240 115" fill="none" stroke="#a855f7" stroke-opacity="0.16" stroke-width="2"/>
    <path d="M700 -8C790 82 842 98 948 50S1120 62 1245 135" fill="none" stroke="#22d3ee" stroke-opacity="0.2" stroke-width="2"/>
    <g font-family="Arial, Helvetica, sans-serif">
      <g transform="translate(58 39)"><rect width="184" height="30" rx="15" fill="#071c2d" stroke="#22d3ee" stroke-opacity="0.45"/><circle cx="18" cy="15" r="5" fill="#34d399" filter="url(#glow)"><animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/></circle><text x="32" y="20" fill="#a7f3d0" font-size="11" font-weight="700" letter-spacing="1.1">OPEN TO OPPORTUNITIES</text></g>
      <text x="58" y="127" fill="#f8fafc" font-size="59" font-weight="800" letter-spacing="1">OMAR REZK</text>
      <rect x="59" y="146" width="405" height="4" rx="2" fill="url(#cyanPurple)"><animate attributeName="width" values="130;405;405" dur="2.8s" repeatCount="indefinite"/></rect>
      <text x="59" y="188" fill="#67e8f9" font-size="22" font-weight="700">Data Analyst  /  BI Developer</text>
      <text x="59" y="223" fill="#cbd5e1" font-size="17">I turn complex business data into clear,</text><text x="59" y="249" fill="#cbd5e1" font-size="17">decision-ready dashboards and insights.</text>
      <g transform="translate(58 282)" font-size="11" font-weight="700" letter-spacing="0.7">
        <g><rect width="91" height="32" rx="9" fill="#f2c811"/><text x="45.5" y="21" text-anchor="middle" fill="#111827">POWER BI</text></g>
        <g transform="translate(102)"><rect width="100" height="32" rx="9" fill="#0b2941" stroke="#38bdf8" stroke-opacity="0.65"/><text x="50" y="21" text-anchor="middle" fill="#e0f2fe">SQL SERVER</text></g>
        <g transform="translate(213)"><rect width="83" height="32" rx="9" fill="#0b2941" stroke="#60a5fa" stroke-opacity="0.65"/><text x="41.5" y="21" text-anchor="middle" fill="#dbeafe">PYTHON</text></g>
        <g transform="translate(307)"><rect width="72" height="32" rx="9" fill="#0d2d2a" stroke="#34d399" stroke-opacity="0.65"/><text x="36" y="21" text-anchor="middle" fill="#d1fae5">EXCEL</text></g>
        <g transform="translate(390)"><rect width="61" height="32" rx="9" fill="#241441" stroke="#a855f7" stroke-opacity="0.7"/><text x="30.5" y="21" text-anchor="middle" fill="#f3e8ff">DAX</text></g>
      </g>
    </g>
    <g transform="translate(570 42)" filter="url(#shadow)" font-family="Arial, Helvetica, sans-serif">
      <rect width="570" height="276" rx="22" fill="#06101f" fill-opacity="0.82" stroke="#334e74"/>
      <circle cx="24" cy="22" r="4" fill="#fb7185"/><circle cx="39" cy="22" r="4" fill="#fbbf24"/><circle cx="54" cy="22" r="4" fill="#34d399"/>
      <text x="85" y="27" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="1.4">LIVE BUSINESS OVERVIEW</text>
      <rect x="477" y="13" width="70" height="20" rx="10" fill="#0b2c2c"/><circle cx="492" cy="23" r="4" fill="#34d399"><animate attributeName="opacity" values="1;.25;1" dur="1.8s" repeatCount="indefinite"/></circle><text x="504" y="27" fill="#6ee7b7" font-size="9" font-weight="700">ONLINE</text>
      <g transform="translate(22 51)">
        <g><rect width="160" height="65" rx="13" fill="#0b1930" stroke="#1d4e76"/><circle cx="27" cy="25" r="12" fill="#082f49"/><path d="M21 29V24M27 29V19M33 29V15" stroke="#22d3ee" stroke-width="3" stroke-linecap="round"/><text x="48" y="23" fill="#94a3b8" font-size="10">SALES MODELED</text><text x="48" y="48" fill="#f8fafc" font-size="22" font-weight="800">$1.12M</text></g>
        <g transform="translate(171)"><rect width="160" height="65" rx="13" fill="#0b1930" stroke="#353068"/><circle cx="27" cy="25" r="12" fill="#27144b"/><path d="M21 26l5-5 4 3 6-8" fill="none" stroke="#c084fc" stroke-width="2.5"/><text x="48" y="23" fill="#94a3b8" font-size="10">TRIPS ANALYZED</text><text x="48" y="48" fill="#f8fafc" font-size="22" font-weight="800">103,728</text></g>
        <g transform="translate(342)"><rect width="184" height="65" rx="13" fill="#0b1930" stroke="#175448"/><circle cx="27" cy="25" r="12" fill="#073c35"/><path d="M21 21h12v8H21zM24 18h6" fill="none" stroke="#34d399" stroke-width="2"/><text x="48" y="23" fill="#94a3b8" font-size="10">LOANS EVALUATED</text><text x="48" y="48" fill="#f8fafc" font-size="22" font-weight="800">38,576</text></g>
      </g>
      <g transform="translate(25 135)">
        <text x="0" y="14" fill="#94a3b8" font-size="10" font-weight="700" letter-spacing="1">PERFORMANCE TREND</text>
        <line x1="0" y1="106" x2="520" y2="106" stroke="#64748b" stroke-opacity="0.25"/><line x1="0" y1="71" x2="520" y2="71" stroke="#64748b" stroke-opacity="0.12"/><line x1="0" y1="36" x2="520" y2="36" stroke="#64748b" stroke-opacity="0.12"/>
        <path d="M0 104C44 100 57 85 92 91S145 58 186 69 236 77 274 53 332 63 370 39 423 51 464 27 497 31 520 18V106H0Z" fill="#0ea5e9" fill-opacity="0.11"/>
        <path id="heroTrend" d="M0 104C44 100 57 85 92 91S145 58 186 69 236 77 274 53 332 63 370 39 423 51 464 27 497 31 520 18" fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 7" filter="url(#glow)"><animate attributeName="stroke-dashoffset" values="60;0" dur="3s" repeatCount="indefinite"/></path>
        <circle r="5" fill="#fff" filter="url(#glow)"><animateMotion dur="5.5s" repeatCount="indefinite"><mpath href="#heroTrend"/></animateMotion></circle>
        <g fill="#22d3ee"><circle cx="92" cy="91" r="4"><animate attributeName="r" values="4;7;4" dur="2.4s" repeatCount="indefinite"/></circle><circle cx="274" cy="53" r="4"><animate attributeName="r" values="4;7;4" dur="2.8s" repeatCount="indefinite"/></circle><circle cx="464" cy="27" r="4"><animate attributeName="r" values="4;7;4" dur="3.1s" repeatCount="indefinite"/></circle></g>
      </g>
    </g>
  </g>
  <rect x="1" y="1" width="1198" height="358" rx="25" fill="none" stroke="url(#cyanPurple)" stroke-opacity="0.45" stroke-width="2"/>
</svg>
