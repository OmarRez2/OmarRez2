<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="26" viewBox="0 0 1200 26" role="img" aria-label="Divider"><title>Divider</title><style>.serif{font-family:Georgia,'Times New Roman',serif}.sans{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.beam{animation:beam 9s ease-in-out infinite alternate}@keyframes beam{to{transform:translateX(1040px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><line x1="0" x2="1200" y1="13" y2="13" stroke="#1c2b47"/><circle cx="600" cy="13" r="4" fill="#d4ae66"/><rect class="beam" x="0" y="12" width="160" height="2" fill="#8fd6ea" opacity=".7"/></svg>