<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="180" viewBox="0 0 1000 180" role="img" aria-labelledby="title desc">
  <title id="title">Animated analytics workflow</title>
  <desc id="desc">Data flows through SQL and Python into Power BI and business insights.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.5" stop-color="#0b1730"/>
      <stop offset="1" stop-color="#140b2d"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" x2="1">
      <stop offset="0" stop-color="#00d4ff"/>
      <stop offset="0.5" stop-color="#38e8a8"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="998" height="178" rx="24" fill="url(#bg)" stroke="#233b66" stroke-width="2"/>
  <path id="route" d="M150 90 C230 30 300 150 380 90 S530 30 610 90 S760 150 850 90" fill="none" stroke="url(#flow)" stroke-width="4" stroke-linecap="round" stroke-dasharray="12 12" opacity="0.6">
    <animate attributeName="stroke-dashoffset" from="48" to="0" dur="2s" repeatCount="indefinite"/>
  </path>

  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <g transform="translate(130 90)">
      <circle r="39" fill="#0b2138" stroke="#00d4ff" stroke-width="2"/>
      <circle r="30" fill="none" stroke="#00d4ff" opacity="0.22">
        <animate attributeName="r" values="29;37;29" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".25;.02;.25" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <text y="-4" fill="#e8f7ff" font-size="15" font-weight="700">RAW DATA</text>
      <text y="17" fill="#78dfff" font-size="11">Excel • Sources</text>
    </g>
    <g transform="translate(375 90)">
      <circle r="39" fill="#092821" stroke="#38e8a8" stroke-width="2"/>
      <circle r="30" fill="none" stroke="#38e8a8" opacity="0.22">
        <animate attributeName="r" values="29;37;29" dur="2.4s" begin=".6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".25;.02;.25" dur="2.4s" begin=".6s" repeatCount="indefinite"/>
      </circle>
      <text y="-4" fill="#eafff8" font-size="15" font-weight="700">SQL + PYTHON</text>
      <text y="17" fill="#72f2c5" font-size="11">Clean • Model</text>
    </g>
    <g transform="translate(620 90)">
      <circle r="39" fill="#102852" stroke="#3388ff" stroke-width="2"/>
      <circle r="30" fill="none" stroke="#3388ff" opacity="0.22">
        <animate attributeName="r" values="29;37;29" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".25;.02;.25" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
      </circle>
      <text y="-4" fill="#edf5ff" font-size="15" font-weight="700">POWER BI</text>
      <text y="17" fill="#77b8ff" font-size="11">DAX • Visualize</text>
    </g>
    <g transform="translate(865 90)">
      <circle r="39" fill="#26123f" stroke="#a855f7" stroke-width="2"/>
      <circle r="30" fill="none" stroke="#a855f7" opacity="0.22">
        <animate attributeName="r" values="29;37;29" dur="2.4s" begin="1.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".25;.02;.25" dur="2.4s" begin="1.8s" repeatCount="indefinite"/>
      </circle>
      <text y="-4" fill="#fbf4ff" font-size="15" font-weight="700">BUSINESS IMPACT</text>
      <text y="17" fill="#d49aff" font-size="11">Insights • Decisions</text>
    </g>
  </g>

  <circle r="6" fill="#ffffff" filter="url(#glow)">
    <animateMotion dur="4s" repeatCount="indefinite" rotate="auto"><mpath href="#route"/></animateMotion>
  </circle>
</svg>

