<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Omar Rezk analytics workflow</title><desc id="desc">Animated five-step workflow from raw data to business decisions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050b18"/><stop offset="1" stop-color="#11113a"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset=".52" stop-color="#3b82f6"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#38bdf8" stroke-opacity=".045"/></pattern>
  </defs>
  <rect width="1200" height="260" rx="22" fill="url(#bg)"/><rect width="1200" height="260" rx="22" fill="url(#grid)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="38" y="39" fill="#f8fafc" font-size="17" font-weight="800">From raw data to business decisions</text><text x="38" y="61" fill="#64748b" font-size="11" letter-spacing="1.3">MY END-TO-END ANALYTICS WORKFLOW</text>
    <path id="flow" d="M124 128C260 98 340 157 458 127S667 98 784 128 984 157 1080 124" fill="none" stroke="#3b82f6" stroke-opacity=".58" stroke-width="4" stroke-dasharray="9 10"><animate attributeName="stroke-dashoffset" values="80;0" dur="4s" repeatCount="indefinite"/></path>
    <circle r="7" fill="#fff" filter="url(#glow)"><animateMotion dur="6s" repeatCount="indefinite"><mpath href="#flow"/></animateMotion></circle>
    <g transform="translate(42 91)">
      <g><rect width="164" height="126" rx="16" fill="#09172a" stroke="#155e75"/><circle cx="82" cy="37" r="24" fill="#083344"/><ellipse cx="82" cy="29" rx="12" ry="5" fill="none" stroke="#22d3ee" stroke-width="2.5"/><path d="M70 29v16c0 3 5 5 12 5s12-2 12-5V29M70 37c0 3 5 5 12 5s12-2 12-5" fill="none" stroke="#22d3ee" stroke-width="2.5"/><text x="82" y="78" fill="#f8fafc" font-size="14" font-weight="800" text-anchor="middle">Collect</text><text x="82" y="98" fill="#94a3b8" font-size="10" text-anchor="middle">SQL / Excel / APIs</text><text x="15" y="20" fill="#22d3ee" font-size="9" font-weight="700">01</text></g>
      <g transform="translate(235)"><rect width="164" height="126" rx="16" fill="#09172a" stroke="#1d4ed8"/><circle cx="82" cy="37" r="24" fill="#102a56"/><path d="M69 46l20-20m-17 3l14 14m-20 2h32" fill="none" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/><text x="82" y="78" fill="#f8fafc" font-size="14" font-weight="800" text-anchor="middle">Clean</text><text x="82" y="98" fill="#94a3b8" font-size="10" text-anchor="middle">Validate / Transform</text><text x="15" y="20" fill="#60a5fa" font-size="9" font-weight="700">02</text></g>
      <g transform="translate(470)"><rect width="164" height="126" rx="16" fill="#09172a" stroke="#4f46e5"/><circle cx="82" cy="37" r="24" fill="#20205d"/><circle cx="82" cy="27" r="5" fill="none" stroke="#818cf8" stroke-width="2.5"/><circle cx="70" cy="47" r="5" fill="none" stroke="#818cf8" stroke-width="2.5"/><circle cx="94" cy="47" r="5" fill="none" stroke="#818cf8" stroke-width="2.5"/><path d="M79 31l-6 11m12-11l6 11M75 47h14" stroke="#818cf8" stroke-width="2"/><text x="82" y="78" fill="#f8fafc" font-size="14" font-weight="800" text-anchor="middle">Model</text><text x="82" y="98" fill="#94a3b8" font-size="10" text-anchor="middle">Relationships / DAX</text><text x="15" y="20" fill="#818cf8" font-size="9" font-weight="700">03</text></g>
      <g transform="translate(705)"><rect width="164" height="126" rx="16" fill="#09172a" stroke="#7e22ce"/><circle cx="82" cy="37" r="24" fill="#2e1457"/><circle cx="78" cy="34" r="10" fill="none" stroke="#c084fc" stroke-width="3"/><path d="M86 42l8 8" stroke="#c084fc" stroke-width="3" stroke-linecap="round"/><path d="M72 36l4-5 4 3 5-7" fill="none" stroke="#c084fc" stroke-width="2"/><text x="82" y="78" fill="#f8fafc" font-size="14" font-weight="800" text-anchor="middle">Analyze</text><text x="82" y="98" fill="#94a3b8" font-size="10" text-anchor="middle">Trends / Drivers / KPIs</text><text x="15" y="20" fill="#c084fc" font-size="9" font-weight="700">04</text></g>
      <g transform="translate(940)"><rect width="164" height="126" rx="16" fill="#09172a" stroke="#047857"/><circle cx="82" cy="37" r="24" fill="#073b34"/><path d="M69 49V38m9 11V30m9 19V34m9 15V24" stroke="#34d399" stroke-width="4" stroke-linecap="round"/><text x="82" y="78" fill="#f8fafc" font-size="14" font-weight="800" text-anchor="middle">Visualize</text><text x="82" y="98" fill="#94a3b8" font-size="10" text-anchor="middle">Insights / Decisions</text><text x="15" y="20" fill="#34d399" font-size="9" font-weight="700">05</text></g>
    </g>
  </g>
</svg>
