<svg xmlns="http://www.w3.org/2000/svg" width="380" height="300" viewBox="0 0 380 300" role="img" aria-label="An animated analytics workspace: SQL queries become dashboards."><title>An animated analytics workspace: SQL queries become dashboards.</title><style>text{font-family:Arial,Helvetica,sans-serif}.float{animation:float 5s ease-in-out infinite}.orb{animation:float 4s ease-in-out infinite reverse}.bar{transform-box:fill-box;transform-origin:bottom;animation:bar 3s ease-in-out infinite}.b2{animation-delay:-1s}.b3{animation-delay:-2s}.query{animation:fade 3s infinite}@keyframes float{50%{transform:translateY(-8px)}}@keyframes bar{50%{transform:scaleY(.45)}}@keyframes fade{50%{opacity:.35}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.role{opacity:0!important}.first{opacity:1!important;clip-path:none!important}}</style><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#16102e"/><stop offset=".5" stop-color="#191337"/><stop offset="1" stop-color="#0e1c32"/></linearGradient><linearGradient id="g"><stop stop-color="#a78bfa"/><stop offset=".5" stop-color="#f0abfc"/><stop offset="1" stop-color="#67e8f9"/></linearGradient><linearGradient id="wave"><stop stop-color="#7c3aed"/><stop offset=".5" stop-color="#d946ef"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs><rect x="4" y="4" width="372" height="292" rx="24" fill="url(#bg)"/><ellipse cx="190" cy="259" rx="140" ry="12" fill="#a78bfa" opacity=".12"/><g class="float"><rect x="42" y="46" width="280" height="173" rx="13" fill="#211b3d" stroke="#8b5cf6" stroke-width="2"/><rect x="54" y="60" width="256" height="143" rx="5" fill="#0e1126"/><circle cx="67" cy="72" r="3" fill="#f472b6"/><circle cx="78" cy="72" r="3" fill="#a78bfa"/><circle cx="89" cy="72" r="3" fill="#22d3ee"/><text x="70" y="101" fill="#c4b5fd" font-size="13">SELECT insights</text><text x="70" y="122" fill="#67e8f9" font-size="13">FROM your_data;</text><path class="query" d="M70 142H168M70 154H147M70 166H156" stroke="#6b6588" stroke-width="5" stroke-linecap="round"/><g fill="#a78bfa"><rect class="bar" x="204" y="130" width="17" height="52" rx="4"/><rect class="bar b2" x="231" y="105" width="17" height="77" rx="4" fill="#22d3ee"/><rect class="bar b3" x="258" y="119" width="17" height="63" rx="4" fill="#e879f9"/></g><path d="M166 220v20h-31v9h95v-9h-31v-20" fill="#6d5b9c"/></g><g class="orb"><circle cx="318" cy="64" r="28" fill="#29204a" stroke="#e879f9"/><path d="M310 53l-9 11 9 11m16-22 9 11-9 11" fill="none" stroke="#e879f9" stroke-width="3"/></g><text x="190" y="283" text-anchor="middle" fill="#bcb3d9" font-size="12" letter-spacing="3">QUERY. EXPLORE. EXPLAIN.</text></svg>